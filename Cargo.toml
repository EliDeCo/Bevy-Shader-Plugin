[package]
name = "bevy-shader-plugin"
version = "0.2.1"
edition = "2024"
license = "MIT"
description = "A Bevy plugin for streamlining fullscreen fragment and compute shader development."
repository = "https://github.com/EliDeCo/Bevy-Shader-Plugin"
readme = "README.md"
keywords = ["bevy", "shader", "compute", "plugin", "wgpu"]
categories = ["game-development", "graphics", "rendering"]
# `examples/` holds reference code to copy into a project, not runnable targets.
autoexamples = false

[lib]
name = "bevy_shader_plugin"

[features]
default = []
# Enables loading `.spv` shaders (e.g. produced by rust-gpu), and reading compute
# workgroup sizes from them.
# Native-only: browsers accept WGSL exclusively, so this breaks wasm builds.
spirv = ["bevy/shader_format_spirv", "naga/spv-in"]

[dependencies]
# Only what the plugin itself uses: the render and core pipeline crates (which bring in
# assets, shaders, windows and cameras) and logging. Apps enable the rest, e.g. through
# Bevy's default features.
bevy = { version = "0.19.1", default-features = false, features = [
    "bevy_core_pipeline",
    "bevy_log",
] }
naga = { version = "29", features = ["wgsl-in"] }
