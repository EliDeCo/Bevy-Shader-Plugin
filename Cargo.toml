[package]
name = "bevy-shader-plugin"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "A Bevy plugin for streamlining fullscreen fragment and compute shader development."
repository = "https://github.com/EliDeCo/Bevy-Shader-Plugin"
readme = "README.md"
keywords = ["bevy", "shader", "compute", "plugin", "wgpu"]
categories = ["game-development", "graphics", "rendering"]

[lib]
name = "bevy_shader_plugin"

[features]
default = []
# Enables loading `.spv` fragment shaders (e.g. produced by rust-gpu).
# Native-only: browsers accept WGSL exclusively, so this breaks wasm builds.
# Compute workgroup-size reflection is WGSL-only for now; supporting SPIR-V there
# will add "naga/spv-in" to this feature.
spirv = ["bevy/shader_format_spirv"]

[dependencies]
bevy = "0.19.1"
encase = "0.12"
wgpu = "29"
naga = { version = "29", features = ["wgsl-in"] }

# Lets `cargo run --example solar_system_rust` load its `.spv` without `--features spirv`.
# Dev-dependency features only apply to examples/tests, not to users of the crate.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
bevy = { version = "0.19.1", features = ["shader_format_spirv"] }
