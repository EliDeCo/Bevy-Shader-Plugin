[package]
name = "shader-build"
version = "0.1.0"
edition = "2024"
publish = false

[build-dependencies]
spirv-builder = "0.10.0"

# Compile build-dependencies in release mode with
# the same settings as regular dependencies.
[profile.release.build-override]
opt-level = 3
codegen-units = 16
[profile.dev.build-override]
opt-level = 3

# Standalone workspace: this crate needs the nightly toolchain below, while the plugin
# itself builds on stable.
[workspace]
